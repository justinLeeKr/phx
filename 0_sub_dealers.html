		<script>
			const dealerRegions = {
				seoul: { name: '서울', dealers: [{ name: '서울강남점', phone: '031-761-6869' }, { name: '서울서부점', phone: '010-7372-6884' }, { name: '서울남부점', phone: '010-8711-8578' }, { name: '서울강서점', phone: '02-2671-3652' }, { name: '서울북부점', phone: '02-973-8004' }] },
				kyungki: { name: '경기', dealers: [{ name: '성남과천', phone: '031-761-6869' }, { name: '화성오산점', phone: '010-2210-8980' }, { name: '경기북부점', phone: '010-9197-9668' }, { name: '경기동부점', phone: '031-555-4443' }, { name: '경기서부', phone: '031-905-4558' }, { name: '평택점', phone: '031-691-0134' }, { name: '수원점', phone: '031-233-2565' }, { name: '시흥점', phone: '031-411-0870' }] },
				incheon: { name: '인천', dealers: [{ name: '인천남부', phone: '032-261-7734' }, { name: '인천점', phone: '032-433-3117' }] },
				kangwon: { name: '강원', dealers: [{ name: '춘천점', phone: '010-6603-2228' }, { name: '원주남부', phone: '033-766-5815' }, { name: '원주점', phone: '080-743-7237' }, { name: '강릉점', phone: '033-653-7354' }] },
				chungnam: { name: '충남', dealers: [{ name: '홍성점', phone: '041-633-9252' }, { name: '천안점', phone: '041-585-8111' }] },
				daejun: { name: '대전', dealers: [{ name: '대전점', phone: '042-934-5589' }] },
				sejong: { name: '세종', dealers: [] },
				chungbuk: { name: '충북', dealers: [{ name: '청주점', phone: '043-262-7666' }, { name: '충주점', phone: '043-855-3782' }, { name: '제천점', phone: '043-645-7237' }] },
				kyungbuk: { name: '경북', dealers: [{ name: '안동점', phone: '054-843-0204' }, { name: '상주점', phone: '010-2480-3937' }, { name: '포항남부', phone: '054-285-2223' }, { name: '포항점', phone: '054-281-8113' }, { name: '영주점', phone: '054-633-7557' }, { name: '구미점', phone: '054-972-3352' }, { name: '경주점', phone: '080-776-0336' }] },
				taekoo: { name: '대구', dealers: [{ name: '서대구점', phone: '053-945-1018' }, { name: '북대구점', phone: '053-326-5542' }, { name: '남대구점', phone: '053-593-1135' }] },
				junbook: { name: '전북', dealers: [{ name: '전주점', phone: '063-211-3737' }, { name: '전북남부', phone: '063-237-3233' }, { name: '전북서부', phone: '063-212-8002' }] },
				ulsan: { name: '울산', dealers: [{ name: '울산점', phone: '052-249-6816' }] },
				kyungnam: { name: '경남', dealers: [{ name: '고성점', phone: '055-674-1214' }, { name: '마산점', phone: '055-277-4788' }, { name: '김해점', phone: '055-333-9588' }] },
				busan: { name: '부산', dealers: [{ name: '부산남부점', phone: '080-705-0608' }, { name: '부산북부점', phone: '055-383-2426' }, { name: '부산동부점', phone: '051-747-0608' }] },
				kwangjoo: { name: '광주', dealers: [{ name: '광주점', phone: '062-956-0444' }] },
				junnam: { name: '전남', dealers: [{ name: '목포남부점', phone: '061-284-4245' }, { name: '순천점', phone: '061-745-0122' }] },
				jeju: { name: '제주', dealers: [{ name: '제주점', phone: '080-758-2238' }] }
			};

			const regionSelect = document.getElementById('dealer-region-select');
			const selectedRegion = document.getElementById('selected-region');
			const dealerCount = document.getElementById('dealer-count');
			const dealerMessage = document.getElementById('dealer-message');
			const dealerResults = document.getElementById('dealer-results');
			const dealerMap = document.getElementById('dealer-map');
			const mapCenter = { x: 175, y: 255 };
			const revealStep = 100;
			const mapRegionsClockwise = [...dealerMap.querySelectorAll('[data-region]')]
				.map((area) => {
					const label = area.querySelector('text');
					const x = Number(label.getAttribute('x'));
					const y = Number(label.getAttribute('y'));
					const angle = (Math.atan2(y - mapCenter.y, x - mapCenter.x) + Math.PI / 2 + Math.PI * 2) % (Math.PI * 2);
					return { area, angle };
				})
				.sort((first, second) => first.angle - second.angle);

			dealerMap.style.setProperty('--region-reveal-duration', `${mapRegionsClockwise.length * revealStep}ms`);
			mapRegionsClockwise.forEach(({ area }, index) => {
				area.style.setProperty('--region-reveal-delay', `${index * revealStep}ms`);
			});
			if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
				dealerMap.classList.add('is-revealing');
			}

			Object.entries(dealerRegions).forEach(([key, region]) => {
				const option = document.createElement('option');
				option.value = key;
				option.textContent = region.name;
				regionSelect.append(option);
			});

			function selectDealerRegion(regionKey) {
				const region = dealerRegions[regionKey];
				if (!region) return;

				regionSelect.value = regionKey;
				selectedRegion.textContent = `${region.name} 지역 대리점`;
				dealerCount.textContent = region.dealers.length ? `대리점 ${region.dealers.length}곳` : '대리점 없음';
				dealerMessage.textContent = region.dealers.length
					? `${region.name} 지역 대리점의 대표 전화번호입니다.`
					: `${region.name} 지역에 등록된 대리점이 없습니다.`;
				dealerResults.replaceChildren();

				region.dealers.forEach((dealer) => {
					const item = document.createElement('div');
					item.className = 'd-flex justify-content-between align-items-center flex-wrap border-bottom py-3';

					const name = document.createElement('span');
					name.className = 'font-weight-semibold text-4';
					name.textContent = dealer.name;

					const phone = document.createElement('a');
					phone.className = 'text-color-primary font-weight-semibold text-decoration-none mt-2 mt-sm-0';
					phone.href = `tel:${dealer.phone.replace(/[^0-9+]/g, '')}`;
					phone.textContent = dealer.phone;

					item.append(name, phone);
					dealerResults.append(item);
				});

				dealerMap.querySelectorAll('[data-region]').forEach((area) => {
					const isSelected = area.dataset.region === regionKey;
					area.setAttribute('aria-pressed', String(isSelected));
					area.querySelectorAll('polygon').forEach((polygon) => {
						polygon.setAttribute('fill', isSelected ? '#0088cc' : '#eaf2f7');
					});
					area.querySelectorAll('text').forEach((label) => {
						label.setAttribute('fill', isSelected ? '#ffffff' : '#40596b');
					});
				});
			}

			dealerMap.addEventListener('click', (event) => {
				const area = event.target.closest('[data-region]');
				if (!area) return;
				event.preventDefault();
				dealerMap.classList.remove('is-revealing');
				selectDealerRegion(area.dataset.region);
			});

			dealerMap.addEventListener('pointerenter', () => {
				dealerMap.classList.remove('is-revealing');
			}, { once: true });

			dealerMap.querySelectorAll('[data-region]').forEach((area) => {
				area.addEventListener('pointerenter', () => {
					if (area.getAttribute('aria-pressed') === 'true') return;
					area.querySelectorAll('polygon').forEach((polygon) => polygon.setAttribute('fill', '#d4e7f2'));
				});
				area.addEventListener('pointerleave', () => {
					if (area.getAttribute('aria-pressed') === 'true') return;
					area.querySelectorAll('polygon').forEach((polygon) => polygon.setAttribute('fill', '#eaf2f7'));
				});
			});

			regionSelect.addEventListener('change', () => selectDealerRegion(regionSelect.value));
		</script>
